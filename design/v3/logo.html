<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jome logo</title>
<style>
:root{--bg:#07110b;--line:#1d3025;--text:#f2f6f1;--mute:#a8b8ac;--green:#5ef08a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif;padding:48px 24px}
main{max-width:1000px;margin:0 auto}a{color:var(--green)}h1{font-weight:500;font-size:40px;margin:0 0 8px}p{color:var(--mute)}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:40px 0 12px;font-weight:500}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.tile{border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.tile .art{height:180px;display:grid;place-items:center;padding:28px}.tile img{max-width:100%;max-height:100%}
.tile figcaption{padding:12px 16px;font-size:13px;color:var(--mute);border-top:1px solid var(--line);background:#0e1b13}
.tile figcaption code{color:var(--text)}
.dark{background:#07110b}.light{background:#fff}.photo{background:linear-gradient(135deg,#e9a05c,#6a4a6a 60%,#1c2f3a)}.green{background:#0f4a26}
.icons{display:flex;align-items:flex-end;gap:20px}.icons img{border-radius:22%}
</style></head><body><main>
<h1>Logo</h1><p>Generated from the supplied <code>Jome Leaf Logo.png</code> (transparent, trimmed). Files live in <code>design/logo/</code>; site uses <code>public/images/logo-light.png</code>.</p>
<h2>Logotype</h2>
<div class="grid">
  <figure class="tile" style="margin:0"><div class="art dark"><img src="../logo/logo-light.png" alt="" width="220"></div><figcaption><code>logo-light.png</code> — dark backgrounds, nav &amp; footer</figcaption></figure>
  <figure class="tile" style="margin:0"><div class="art light"><img src="../logo/logo-dark.png" alt="" width="220"></div><figcaption><code>logo-dark.png</code> — light backgrounds (original colours)</figcaption></figure>
  <figure class="tile" style="margin:0"><div class="art photo"><img src="../logo/logo-white.png" alt="" width="220"></div><figcaption><code>logo-white.png</code> — one-colour, on photos</figcaption></figure>
  <figure class="tile" style="margin:0"><div class="art light"><img src="../logo/logo-black.png" alt="" width="220"></div><figcaption><code>logo-black.png</code> — one-colour, print</figcaption></figure>
</div>
<h2>Small sizes (nav height)</h2>
<div class="grid">
  <figure class="tile" style="margin:0"><div class="art dark" style="height:100px"><img src="../logo/logo-light.png" alt="" height="40"></div><figcaption>40 px high</figcaption></figure>
  <figure class="tile" style="margin:0"><div class="art dark" style="height:100px"><img src="../logo/logo-light.png" alt="" height="24"></div><figcaption>24 px high</figcaption></figure>
</div>
<h2>App icon</h2>
<div class="tile"><div class="art dark icons" style="height:auto"><img src="../logo/app-icon-192.png" width="128" alt=""><img src="../logo/app-icon-192.png" width="64" alt=""><img src="../logo/app-icon-32.png" width="32" alt=""></div><figcaption><code>app-icon-1024 / 512 / 192 / 32.png</code></figcaption></div>
</main></body></html>
